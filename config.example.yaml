# omugw 配置示例
#
# 字符串值支持 ${ENV_VAR} 展开。引用未定义的环境变量会导致**启动失败**——
# 这是刻意的：一个空的 API Key 会在运行时变成难以定位的 401，
# 在启动时就报错要好得多。
#
# 下面的 auth / credentials / providers / models 四段要么全配，要么全不配。
# 全不配是合法的（只提供健康检查）；配一半会启动失败——一份写了 providers 却
# 漏了 models 的配置，作者显然是想让网关工作的，静默降级只会让人对着一个
# 「一直返回 404」的网关查半天。

server:
  addr: ":8080"
  # metrics 与网关分开监听。metrics 端点不应暴露在对外端口上。
  metrics_addr: "127.0.0.1:9090"

# 网关自身的鉴权。**不可省略**——一个不鉴权的 AI 网关等于把上游凭据免费送人。
auth:
  keys:
    - id: default # 出现在日志与指标里，用于区分调用方。不得由 key 派生。
      key: "${OMUGW_API_KEY}" # 至少 16 字符

# 上游凭据，按池分组。同池内可放多份，用于加权轮询与 failover。
credentials:
  openai:
    - id: primary
      secret: "${OPENAI_API_KEY}"
      weight: 1
      priority: 0 # 越小越优先。典型用法：先用便宜的额度，用完再用贵的。

# 上游端点。
#
# endpoint 与 kind 分开是必须的：OpenAI、DeepSeek、Kimi 都是 openai.compat，
# 降级矩阵看它们完全一样（同一套线格式），而路由必须分得清该发去哪一个。
providers:
  - endpoint: openai
    kind: openai.compat
    base_url: "https://api.openai.com"
    credential_pool: openai

  # DashScope 的两族以注释形态给出：${...} 引用未定义的环境变量会导致
  # **启动失败**（见文件开头），只设了 OPENAI_API_KEY 的人取消注释就起不来。
  # 要用先在 credentials 下补一个 dashscope 池。
  #
  # - endpoint: dashscope-compat
  #   kind: dashscope.compatible
  #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #   credential_pool: dashscope
  #
  # - endpoint: dashscope-native
  #   kind: dashscope.native
  #   base_url: "https://dashscope.aliyuncs.com"
  #   credential_pool: dashscope

# 模型路由。match 支持三种显式形态：精确、"前缀*"、"*" 兜底。
# 不支持中缀通配——匹配顺序不可预期意味着请求会去到谁也说不清的地方。
#
# 这里是**唯一**决定「哪些模型可以被请求」的地方。下面的 discovery 只往
# /v1/models 的清单里补充上游声称拥有的模型，不会让它们变得可调用。
models:
  - match: "gpt-5"
    targets:
      - endpoint: openai
        upstream_model: "gpt-5" # 客户端请求的名字可以与上游真实名字不同

  # - match: "qwen-*"
  #   targets:
  #     - endpoint: dashscope-compat
  #       upstream_model: "qwen-plus"

  # 指向 dashscope.native 的 target 必须声明 native_endpoint：门是部署事实，
  # 不按模型名或本次请求是否含媒体推断。枚举只有 text-generation 与
  # multimodal-generation 两个，填错或漏填都在启动期被拒。
  #
  # - match: "qwen-vl-*"
  #   targets:
  #     - endpoint: dashscope-native
  #       upstream_model: "qwen-vl-max"
  #       native_endpoint: multimodal-generation

# 上游模型清单发现。**默认关闭。**
#
# 开启后，网关会按周期向已配置的上游询问它们各自的模型清单，结果只用于充实
# 受鉴权的 GET /v1/models。**发现绝不创建路由**：上游目录不等于本网关可调用
# 的集合（DashScope 的列表接口返回的是「平台上可用的模型」，OpenAI 的列表也
# 不带「这把 key 能否调用」的位）。想让一个模型可被请求，只能写进上面的 models。
#
# 按协议族走各自的官方接口：openai.compat 走 GET /v1/models，
# dashscope.native 走 GET /api/v1/models（页码分页）。
# dashscope.compatible 没有官方列表接口，会被显式跳过——这不是故障。
#
# 默认关闭是因为发现会拿真实凭据打上游：那是一个会花钱、会产生外部流量的
# 决定，得由你显式做出。
discovery:
  enabled: false
  refresh_interval: 30m
  # 目录查询的超时必须显著小于刷新间隔，否则两轮发现会彼此追尾。
  timeout: 10s

# 网关侧会话存储，为 OpenAI Responses 的 previous_response_id 提供服务端会话。
#
# **默认关闭。** 内存态会话在多副本部署下是错的：请求被负载均衡到另一个副本
# 就找不到会话，表现为「会话时有时无」——最难查的一类 bug。开启即表示你确认
# 是单副本部署，或已接受重启丢失历史。
convstore:
  enabled: false
  ttl: 2h
  max_chain_depth: 200
  max_messages: 1000
  gc_interval: 5m

# 四层超时（原则 2.7）。
#
# 分四层不是过度设计：只有一个总超时的话，一个思考 3 分钟的推理请求
# 和一个挂死的连接长得一模一样。
timeouts:
  # 建立 TCP + TLS 连接的上限。
  connect: 10s

  # 发出请求到收到上游响应头的上限。
  #
  # 注意这是**上游**首字节，它是换凭据重试的依据。真正的 failover 禁区是
  # **下游**首字节——网关向客户端发出第一个字节之后就不能重试了，
  # 否则客户端会收到重复内容（原则 2.4）。
  first_byte: 120s

  # 整个请求的上限，含流式传输全程。
  total: 30m

  # 流式传输中两个数据块之间的最大间隔。
  # 它才是「上游挂死」的真正判据——total 到期只说明响应很长。
  idle: 60s

log:
  level: info # debug | info | warn | error
  format: json # json | text

limits:
  # 单个请求中内联（base64）多模态负载的总大小上限。
  #
  # URL 形态不受此限——那种情况下字节根本不经过网关（原则 2.6：
  # 网关不代下载，否则会变成流量黑洞）。
  max_inline_bytes: 20971520 # 20 MiB

  # 请求体总大小上限，必须不小于 max_inline_bytes。
  max_request_bytes: 33554432 # 32 MiB
